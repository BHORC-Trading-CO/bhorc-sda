# Сборка и проверка на Windows и macOS.
#
# Смысл матрицы: почти вся логика упаковки одинакова на обеих платформах, но
# копирование node_modules в собранное приложение — самое расходящееся по ОС
# место (симлинки, права, длина путей). Поэтому пакуем на обеих и проверяем
# результат одинаковым скриптом.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # node-gyp 8 (тянется из electron-rebuild) импортирует distutils, которого
      # нет в Python 3.12+. Фиксируем 3.11, чтобы сборка не зависела от того,
      # какой Python оказался в образе раннера.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Именно install, а не ci: package-lock.json в репозитории отстал от
      # package.json (в нём нет jest-зависимостей), и ci на нём падает.
      # sharp качает libvips с GitHub Releases и падает с "Request timed out", когда
      # загрузка медленная (05.11 так падали все прогоны подряд): до трёх попыток.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm install && exit 0
            echo "npm install failed (attempt $attempt of 3)"
            sleep 30
          done
          exit 1

      - name: Unit tests
        run: npm test

      - name: Package app
        run: npm run package

      # Ловит "Cannot find module 'steamcommunity'" до того, как это увидит
      # пользователь: проверяет, что все webpack externals разрешаются из
      # раскладки собранного приложения и что в нём нет лишних .bin.
      - name: Verify packaged app
        run: npm run verify:package

      # Упакованное Windows-приложение для ручной проверки: на Windows локально
      # никто не запускает, поэтому коллега скачивает папку из артефакта прогона
      # PR и смотрит окно руками (нативные кнопки заголовка и т.п.).
      # include-hidden-files нужен: код приложения лежит в скрытой .webpack,
      # без него upload-artifact её пропускает и пакет не запускается.
      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bhorc-sda-windows-${{ github.sha }}
          path: out/BHORC SDA-win32-x64/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
